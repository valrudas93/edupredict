[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — manejado por formatter
    "B008",  # do not perform function calls in default args
    "N803",  # X_train, X_val: convención estándar en ML (scikit-learn, Keras)
    "N806",  # X_fusion: idem — matrices de features se nombran en mayúscula por convención
    "B905",  # zip() strict: no aplica en contextos de visualización/logging
    "RUF001", # guiones en texto — caracteres intencionales en strings de UI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # nombres de test pueden no seguir convención

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
